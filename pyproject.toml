[project]
name = "game-survey-workbench"
version = "0.1.0"
description = "Local-first game survey research workbench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "httpx>=0.28,<1.0",
  "openpyxl>=3.1,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "python-frontmatter>=1.1,<2.0",
  "sqlmodel>=0.0.24,<1.0",
  "pandas>=2.2,<3.0",
  "markitdown>=0.1,<1.0",
  "mistune>=3.0,<4.0",
  "lxml>=6.0,<7.0",
  "mammoth>=1.11,<2.0",
  "pdfminer-six>=20251230,<20270000",
  "pdfplumber>=0.11.9,<1.0",
  "python-pptx>=1.0.2,<2.0",
  "chromadb>=1.5.5",
  "openai>=2.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "uvicorn>=0.34,<1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
